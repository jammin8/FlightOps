name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - name: collector against this repository
        env:
          GH_TOKEN: ${{ github.token }}
          FLIGHTOPS_CONFIG: ${{ runner.temp }}/flightops/config.json
          FLIGHTOPS_DATA_DIR: ${{ runner.temp }}/flightops
          FLIGHTOPS_STATUS_FILE: ${{ runner.temp }}/flightops/status.json
        run: |
          python collectors/flightops.py use "$GITHUB_REPOSITORY"
          python collectors/flightops.py collect
          python collectors/flightops.py status
          python - <<'PY'
          import json, os
          s = json.load(open(os.environ["FLIGHTOPS_STATUS_FILE"]))
          assert s["repos"][0]["state"] == "ok", s["repos"]
          assert s["views"]["all"]["counts"]["open"] is not None
          assert s["views"]["all"]["counts"]["merged_today"] is not None
          PY

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: python tests
        run: python -m unittest discover -s tests
      - run: swift --version
      - name: swift build
        run: swift build
      - name: render every tab from the sample status file
        run: |
          .build/debug/FlightOps --snapshot "$RUNNER_TEMP/snapshots" --status collectors/sample-status.json &
          pid=$!
          for _ in $(seq 1 60); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null && { echo "snapshot timed out"; exit 1; }
          wait $pid
          ls "$RUNNER_TEMP/snapshots"
          test "$(ls "$RUNNER_TEMP/snapshots" | wc -l)" -eq 6
      - name: preview light-now
        run: |
          for z in 640 560 480 420 360; do sips -s format jpeg -s formatOptions 35 -Z $z "$RUNNER_TEMP/snapshots/light-now.png" --out /tmp/light-now.jpg >/dev/null; [ $(stat -f%z /tmp/light-now.jpg) -lt 23000 ] && break; done
          ls -l /tmp/light-now.jpg
          base64 -i /tmp/light-now.jpg | tr -d '\n' | fold -w 4000 | head -8 | nl -ba | while read -r i chunk; do echo "::notice title=shot light-now $i::$chunk"; done
      - name: preview dark-now
        run: |
          for z in 640 560 480 420 360; do sips -s format jpeg -s formatOptions 35 -Z $z "$RUNNER_TEMP/snapshots/dark-now.png" --out /tmp/dark-now.jpg >/dev/null; [ $(stat -f%z /tmp/dark-now.jpg) -lt 23000 ] && break; done
          ls -l /tmp/dark-now.jpg
          base64 -i /tmp/dark-now.jpg | tr -d '\n' | fold -w 4000 | head -8 | nl -ba | while read -r i chunk; do echo "::notice title=shot dark-now $i::$chunk"; done
      - name: preview light-trends
        run: |
          for z in 640 560 480 420 360; do sips -s format jpeg -s formatOptions 35 -Z $z "$RUNNER_TEMP/snapshots/light-trends.png" --out /tmp/light-trends.jpg >/dev/null; [ $(stat -f%z /tmp/light-trends.jpg) -lt 23000 ] && break; done
          ls -l /tmp/light-trends.jpg
          base64 -i /tmp/light-trends.jpg | tr -d '\n' | fold -w 4000 | head -8 | nl -ba | while read -r i chunk; do echo "::notice title=shot light-trends $i::$chunk"; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
